<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#DCEFF6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="색칠놀이">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>콕콕 색칠놀이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 화면 규칙(고정): 가로 = [색 팔레트 | 그림판 | 도구(오른손)] 3열, 세로 = 그림판 위 · 팔레트 · 도구 아래.
   그림판은 남은 공간을 모두 차지하고, 팔레트·도구 크기는 화면 높이에 비례해 정해진다. 새 기능은 이 틀 안에만 추가한다. */
:root{
  --bg:#DCEFF6; --bg-dot:#C7E3EE; --board:#FFFFFF; --ink:#2B2D42; --muted:#5E6B80;
  --tool-shadow:#B5D2DE; --accent:#FF7A59; --panel:rgba(255,255,255,.55);
  --display:"Jua","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --sw:clamp(46px,8.4vh,74px);  /* 색 동그라미 */
  --tb:clamp(58px,11vh,88px);   /* 도구 버튼 */
  --gap:14px;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;overflow:hidden;margin:0;
  background:var(--bg) radial-gradient(var(--bg-dot) 2px,transparent 2.5px) 0 0/28px 28px;
  color:var(--ink);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}

.app{
  height:100%;padding-block:14px;display:grid;gap:var(--gap);
  grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);
  grid-template-areas:"palette stage tools";
}

/* 팔레트 */
.palette{
  grid-area:palette;align-self:center;display:grid;gap:12px;padding:14px;
  grid-template-columns:repeat(var(--cols,2),var(--sw));background:var(--panel);border-radius:30px;
}
.swatch{
  width:var(--sw);height:var(--sw);border-radius:50%;border:4px solid #fff;
  box-shadow:0 4px 0 rgba(43,45,66,.18);transition:transform .15s;
}
.swatch[aria-pressed="true"]{transform:scale(1.1);outline:5px solid var(--ink);outline-offset:3px}

/* 그림판 */
.stage{grid-area:stage;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:6px;min-height:44px}
.topbar h1{margin:0;white-space:nowrap;font-size:clamp(24px,4.2vh,34px);font-weight:400;letter-spacing:.02em}
.hint{font-size:16px;color:var(--muted);margin-left:10px}
.dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
.dots span{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff;transition:background .2s}
/* 자유 그리기: 붓 굵기는 진행 동그라미 자리에 */
.brush{display:flex;align-items:center;gap:10px;--cur:#F2545B}
.bsz{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--tool-shadow)}
.bsz i{display:block;width:var(--d);height:var(--d);border-radius:50%;background:var(--cur)}
.bsz[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.bsz.rainbow i{width:30px;height:30px;background:conic-gradient(#F2545B,#FF9F43,#FFD93D,#5BC27A,#6EC6F0,#3D7BE0,#9B6BE0,#FF8FC1,#F2545B)}
.mission{display:inline-flex;align-items:center;gap:8px;margin-left:12px;background:#fff;border-radius:999px;padding:6px 14px 6px 8px;font-size:18px;box-shadow:0 3px 0 var(--tool-shadow);vertical-align:middle;white-space:nowrap}
.mission i{width:26px;height:26px;border-radius:50%;border:3px solid #fff;outline:3px solid var(--ink)}
.stars{color:#E8950C}
.pic .r.target{stroke:var(--accent);stroke-dasharray:16 10;animation:march .9s linear infinite}
@keyframes march{to{stroke-dashoffset:-52}}
#guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#guide path,#guide circle{fill:none;stroke:#AFC3D1;stroke-width:12;stroke-dasharray:.1 24;stroke-linecap:round;stroke-linejoin:round}
.bsz svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-dasharray:1.5 4.5;stroke-linecap:round}
.levels{display:grid;gap:12px}
.lv{display:flex;justify-content:space-between;align-items:center;gap:14px;border:4px solid var(--bg);border-radius:22px;padding:16px 20px;text-align:left;font-size:24px}
.lv small{display:block;font-size:15px;color:var(--muted);margin-top:4px;line-height:1.4}
.lv[aria-pressed="true"]{border-color:var(--ink)}
.lv b{font-weight:400;background:var(--ink);color:#fff;border-radius:999px;padding:4px 12px;font-size:15px}
.parent-note{margin:14px 4px 0;color:var(--muted);font-size:15px}
#picName{touch-action:none}
#paper{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.topbar{min-height:54px}
.board{
  position:relative;background:var(--board);border-radius:32px;min-height:0;
  box-shadow:0 6px 0 var(--tool-shadow);display:grid;place-items:center;padding:12px;overflow:hidden;
}
.board svg{width:100%;height:100%;display:block}

/* 도구 (오른손 쪽) */
.tools{grid-area:tools;display:flex;flex-direction:column;justify-content:center;gap:12px}
.tool{
  position:relative;overflow:hidden;width:var(--tb);height:var(--tb);border-radius:24px;background:#fff;
  box-shadow:0 5px 0 var(--tool-shadow);display:grid;place-items:center;align-content:center;gap:2px;
  font-size:clamp(12px,1.8vh,15px);
}
.tool svg{width:44%;height:auto;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;position:relative}
.tool span{position:relative;white-space:nowrap}
.tool.on{background:var(--ink);color:#fff;box-shadow:0 5px 0 #11121c}
.tool:active{transform:translateY(3px);box-shadow:0 2px 0 var(--tool-shadow)}
.tool .hold{position:absolute;inset:0;background:#FFD6CB;transform:scaleY(0);transform-origin:bottom}
.tool.holding .hold{transform:scaleY(1);transition:transform .9s linear}

/* 완성 배너 */
.done{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;
  display:flex;align-items:center;gap:14px;white-space:nowrap;
  background:var(--ink);color:#fff;border-radius:999px;padding:10px 10px 10px 26px;font-size:clamp(20px,3.2vh,26px);
  animation:rise .4s ease-out;
}
.done button{background:var(--accent);color:#fff;border-radius:999px;padding:12px 24px;font-size:inherit}
@keyframes rise{from{transform:translate(-50%,40px);opacity:0}}

/* 그림 고르기 */
.picker{position:fixed;inset:0;z-index:20;background:rgba(43,45,66,.5);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.picker-card{background:#fff;border-radius:34px;padding:22px;width:min(920px,100%);max-height:100%;overflow:auto}
.picker-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.picker-head h2{margin:0;font-weight:400;font-size:28px}
.close{width:56px;height:56px;border-radius:50%;background:var(--bg);font-size:28px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.pick{border:4px solid var(--bg);border-radius:24px;padding:10px 6px;display:grid;gap:6px;font-size:clamp(16px,2.6vh,20px);white-space:nowrap;position:relative}
.pick[aria-current="true"]{border-color:var(--ink)}
.pick svg{width:100%;aspect-ratio:1;max-width:100%;max-height:18vh;pointer-events:none}
.badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;font-size:15px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

/* 그림 공통 */
.pic .r{fill:#fff;stroke:var(--ink);stroke-width:6;stroke-linejoin:round;cursor:pointer;transition:fill .15s;transform-box:fill-box;transform-origin:center}
.pic .fx{pointer-events:none}
.pic .line{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.pic .dot{fill:var(--ink)}
.pic .white{fill:#fff;stroke:var(--ink);stroke-width:5}
.pic .bubble{fill:#fff;stroke:var(--ink);stroke-width:4}
.pic g{transform-box:view-box}
.pic .pop{animation:pop .35s ease-out}
@keyframes pop{40%{transform:scale(1.07)}}

/* 완성하면 살아 움직이기 */
.alive .fish{animation:swim 2.4s ease-in-out infinite;transform-origin:200px 200px}
.alive .fish-tail{animation:wag .35s ease-in-out infinite alternate;transform-origin:112px 200px}
.alive .bubble{animation:bub 1.8s ease-in infinite}
.alive .bubble:nth-child(2){animation-delay:.5s}.alive .bubble:nth-child(3){animation-delay:1s}
@keyframes swim{0%,100%{transform:translateX(-16px) rotate(-3deg)}50%{transform:translateX(16px) rotate(3deg)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes bub{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
.alive .bfly{animation:float 2s ease-in-out infinite}
.alive .wingL,.alive .wingR{animation:flap .32s ease-in-out infinite alternate;transform-origin:200px 210px}
@keyframes float{0%,100%{transform:translateY(10px)}50%{transform:translateY(-14px)}}
@keyframes flap{to{transform:scaleX(.45)}}
.alive .car{animation:drive 1.8s ease-in-out infinite}
.pic g.wheel{transform-box:fill-box;transform-origin:center}
.alive .wheel{animation:spin .55s linear infinite}
@keyframes drive{0%,100%{transform:translate(-18px,0)}25%{transform:translate(0,-6px)}50%{transform:translate(18px,0)}75%{transform:translate(0,-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.alive .flower{animation:sway 2.2s ease-in-out infinite;transform-origin:200px 372px}
.alive .head{animation:bloom 1s ease-in-out infinite alternate;transform-origin:200px 150px}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes bloom{to{transform:scale(1.08)}}
.alive .cat{animation:hop 1.4s ease-in-out infinite}
.alive .cat-tail{animation:wag 0.5s ease-in-out infinite alternate;transform-origin:262px 312px}
.alive .cat-head{animation:tilt 1.4s ease-in-out infinite;transform-origin:200px 240px}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.alive .dino{animation:stomp 1.2s ease-in-out infinite}
.alive .dino-neck{animation:nod .9s ease-in-out infinite alternate;transform-origin:235px 245px}
.alive .dino-tail{animation:wag .45s ease-in-out infinite alternate;transform-origin:118px 255px}
@keyframes stomp{0%,100%{transform:translate(-10px,0)}25%{transform:translate(0,-8px)}50%{transform:translate(10px,0)}75%{transform:translate(0,-8px)}}
@keyframes nod{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
.alive .train{animation:chug .5s ease-in-out infinite alternate}
.alive .smoke{animation:puff 1.4s ease-out infinite}
.alive .smoke:nth-child(2){animation-delay:.45s}.alive .smoke:nth-child(3){animation-delay:.9s}
@keyframes chug{from{transform:translate(-6px,0)}to{transform:translate(6px,-4px)}}
@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(-30px,-60px) scale(1.4);opacity:0}}
.pic .smoke{transform-box:fill-box;transform-origin:center}
.alive .whale{animation:bob 2s ease-in-out infinite;transform-origin:200px 230px}
.alive .whale-tail{animation:flick .5s ease-in-out infinite alternate;transform-origin:318px 238px}
.alive .spout{animation:spurt .7s ease-in-out infinite alternate;transform-origin:150px 128px}
@keyframes bob{0%,100%{transform:translateY(8px) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes flick{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes spurt{from{transform:scaleY(.75)}to{transform:scaleY(1.15)}}
/* 탈것 */
.alive .bus,.alive .firetruck,.alive .dump{animation:drive 1.8s ease-in-out infinite}
.alive .ladder{animation:ladder 1.6s ease-in-out infinite alternate;transform-origin:232px 166px}
.alive .siren{animation:flash .5s steps(2) infinite}
.alive .bed{animation:tip 1.6s ease-in-out infinite alternate;transform-origin:56px 240px}
.alive .excavator{animation:float 2.4s ease-in-out infinite}
.alive .arm{animation:dig 1.4s ease-in-out infinite alternate;transform-origin:254px 192px}
.alive .bucket{animation:curl 1.4s ease-in-out infinite alternate;transform-origin:360px 202px}
@keyframes ladder{to{transform:rotate(-28deg)}}
@keyframes flash{50%{opacity:.3}}
@keyframes tip{to{transform:rotate(-22deg)}}
@keyframes dig{to{transform:rotate(-14deg)}}
@keyframes curl{to{transform:rotate(30deg)}}
@keyframes doorop{to{transform:scaleX(.25)}}
.pic g.door.jiggle{animation:doorop .3s ease-in-out 2 alternate;transform-origin:246px 206px}
.pic g.ladder.jiggle{animation:ladder .5s ease-in-out 2 alternate;transform-origin:232px 166px}
.pic g.siren.jiggle{animation:flash .3s steps(2) 4}
.pic g.bed.jiggle{animation:tip .5s ease-in-out 2 alternate;transform-origin:56px 240px}
.pic g.arm.jiggle{animation:dig .4s ease-in-out 2 alternate;transform-origin:254px 192px}
.pic g.bucket.jiggle{animation:curl .35s ease-in-out 2 alternate;transform-origin:360px 202px}
.alive .police,.alive .tractor{animation:drive 1.8s ease-in-out infinite}
.alive .plane{animation:fly 2.6s ease-in-out infinite}
.alive .cloud{animation:drift 3s ease-in-out infinite alternate}
.alive .boat,.alive .duck{animation:bob 2s ease-in-out infinite;transform-origin:200px 260px}
.alive .flag{animation:wave .4s ease-in-out infinite alternate;transform-origin:190px 148px}
.alive .heli{animation:float 2s ease-in-out infinite}
.alive .rotor{animation:rscale .16s linear infinite alternate;transform-origin:190px 145px}
.pic g.trotor{transform-box:fill-box;transform-origin:center}
.alive .trotor{animation:spin .3s linear infinite}
.alive .rocket{animation:launch 1.6s ease-in-out infinite}
.alive .flame{animation:flicker .14s ease-in-out infinite alternate;transform-origin:200px 282px}
.alive .bunny{animation:hop 1s ease-in-out infinite}
.alive .ears{animation:tilt 1.2s ease-in-out infinite;transform-origin:200px 140px}
.alive .dwing{animation:flapw .3s ease-in-out infinite alternate;transform-origin:155px 252px}
@keyframes fly{0%,100%{transform:translate(-12px,8px) rotate(-3deg)}50%{transform:translate(12px,-12px) rotate(3deg)}}
@keyframes drift{to{transform:translateX(-30px)}}
@keyframes wave{to{transform:skewY(12deg) scaleX(.85)}}
@keyframes rscale{to{transform:scaleX(.12)}}
@keyframes launch{0%,100%{transform:translateY(10px)}50%{transform:translateY(-20px)}}
@keyframes flicker{to{transform:scaleY(1.35) scaleX(.85)}}
@keyframes flapw{to{transform:rotate(-25deg)}}
.pic g.flag.jiggle{animation:wave .2s ease-in-out 4 alternate;transform-origin:190px 148px}
.pic g.rotor.jiggle{animation:rscale .12s linear 6 alternate;transform-origin:190px 145px}
.pic g.trotor.jiggle{animation:spin .4s linear 2}
.pic g.flame.jiggle{animation:flicker .12s ease-in-out 6 alternate;transform-origin:200px 282px}
.pic g.ears.jiggle{animation:tilt .6s ease-in-out;transform-origin:200px 140px}
.pic g.dwing.jiggle{animation:flapw .18s ease-in-out 4 alternate;transform-origin:155px 252px}
.alive .ambulance,.alive .mixer,.alive .crane,.alive .forklift,.alive .moto{animation:drive 1.8s ease-in-out infinite}
.alive .drum{animation:churn 1.2s ease-in-out infinite alternate;transform-origin:146px 184px}
.alive .boom{animation:raise 1.6s ease-in-out infinite alternate;transform-origin:160px 226px}
.alive .fork{animation:lift 1.4s ease-in-out infinite alternate}
.alive .sub{animation:bob 2.2s ease-in-out infinite;transform-origin:200px 220px}
.alive .prop{animation:wag .2s ease-in-out infinite alternate;transform-origin:60px 222px}
.alive .sun{animation:bloom 1.2s ease-in-out infinite alternate;transform-origin:342px 58px}
.alive .cl{animation:drift 3s ease-in-out infinite alternate}
@keyframes churn{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes raise{to{transform:rotate(10deg)}}
@keyframes lift{to{transform:translateY(-70px)}}
.pic g.drum.jiggle{animation:churn .3s ease-in-out 2 alternate;transform-origin:146px 184px}
.pic g.boom.jiggle{animation:raise .4s ease-in-out 2 alternate;transform-origin:160px 226px}
.pic g.fork.jiggle{animation:lift .4s ease-in-out 2 alternate}
.pic g.prop.jiggle{animation:wag .15s ease-in-out 4 alternate;transform-origin:60px 222px}
.pic g.sun.jiggle{animation:bloom .3s ease-in-out 2 alternate;transform-origin:342px 58px}
/* 놀이·그림책: 화면 틀은 그대로, 쓰지 않는 팔레트·도구만 흐리게 */
.app.game .palette,.app.game #tUndo,.app.game #tErase{opacity:.3;pointer-events:none}
#game{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:16px;overflow:auto;overscroll-behavior:contain}
.gstar{font-weight:400;font-size:22px;color:#E8950C;background:#fff;border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 var(--tool-shadow);white-space:nowrap}
.listen{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border-radius:999px;padding:12px 28px;font-size:clamp(20px,3.4vh,28px);box-shadow:0 5px 0 #D65A3D}
.listen svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.choices{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:16px;width:min(100%,calc(var(--n) * 250px),calc((100vh - 260px) * var(--n)))}
.qcard{background:#fff;border:5px solid var(--bg);border-radius:26px;padding:8px;aspect-ratio:1;display:grid;place-items:center;box-shadow:0 5px 0 var(--tool-shadow);overflow:hidden}
.qcard svg{width:100%;height:100%;pointer-events:none;border-radius:16px}
.qcard.right{border-color:#5BC27A}
.qcard.wrong{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.mgrid{display:grid;gap:12px;justify-content:center}
.mcard{position:relative;perspective:800px;border-radius:20px}
.mcard .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.back{background:var(--accent) radial-gradient(rgba(255,255,255,.35) 3px,transparent 3.5px) 0 0/22px 22px;box-shadow:0 5px 0 #D65A3D}
.back i{font-style:normal;color:#fff;font-size:clamp(30px,6vh,52px)}
.front{background:#fff;transform:rotateY(180deg);box-shadow:0 5px 0 var(--tool-shadow);padding:6px}
.front svg{width:100%;height:100%;border-radius:14px}
.mcard.matched .front{box-shadow:0 0 0 5px #5BC27A}
.blist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:min(100%,860px)}
.bcover{background:#fff;border:5px solid var(--bg);border-radius:26px;padding:12px;display:grid;gap:8px;box-shadow:0 5px 0 var(--tool-shadow);font-size:clamp(18px,3vh,24px)}
.bcover svg{width:100%;aspect-ratio:1;pointer-events:none;border-radius:16px}
.page{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:12px;width:100%;height:100%}
.page-pic{min-height:0;display:grid;place-items:center}
.page-pic>svg{height:100%;max-width:100%;aspect-ratio:1;border-radius:20px}
.page-pic>svg.tstage{aspect-ratio:auto;width:100%;border-radius:0}
.page-text{font-size:clamp(24px,4.6vh,42px);text-align:center;line-height:1.45;text-wrap:balance;min-height:1.45em}
.page-text span{transition:color .15s}
.page-text span.on{color:var(--accent)}
.page-nav{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* 퍼즐 · 그림자 · 다른 곳 */

.pic g.rarm-l.jiggle{animation:flapw .25s ease-in-out 2 alternate;transform-origin:103px 190px}

/* 세차장 · 정비소 · 운전하기 */
.stagebox{width:100%;height:100%;display:grid;place-items:center;min-height:0;align-self:stretch}

.steps-ind{font-size:17px}.dots .steps-ind span{width:auto;height:auto;border:0;border-radius:0;background:none;color:var(--muted)}.steps-ind b{color:var(--accent);font-weight:400}
.pic .washfx{pointer-events:none}

.garage{position:relative;width:100%;height:100%;display:grid;grid-template-rows:minmax(0,1fr) 120px;gap:8px;align-self:stretch}

/* 옛 동화 · 탈것 영상 */
.bcover.tale img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:#F3EEE3;pointer-events:none}
.credit{grid-column:1/-1;margin:10px 4px 0;font-size:13px;color:var(--muted);line-height:1.5;text-align:center}

.rest-card{background:#fff;border-radius:30px;padding:24px;width:min(460px,100%);text-align:center}

.rest-pic{position:relative;width:200px;margin:auto}.rest-pic svg{width:100%;display:block;filter:saturate(.7) brightness(.95)}
.rest-z{position:absolute;right:-6px;top:4px;font-size:28px;color:#6B7280;animation:float 2s ease-in-out infinite alternate}
.rest-hold{position:relative;overflow:hidden;margin-top:10px;background:var(--bg);border-radius:999px;padding:12px 20px;font-size:15px;color:var(--muted);touch-action:none;-webkit-user-select:none;user-select:none}
.rest-hold i{position:absolute;inset:0;width:0;background:#FFD93D;opacity:.6}.rest-hold.holding i{width:100%;transition:width 3s linear}.rest-hold span{position:relative}
/* 도구 고르기 */
.token.sel{transform:scale(1.15);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #FF9F43) drop-shadow(0 6px 0 rgba(43,45,66,.25))}
.token.sel::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:5px solid #FF9F43;animation:gpulse 1s ease-in-out infinite}
.washfx .wcur{pointer-events:none}.washfx .wcur .spinb2{transform-box:fill-box;transform-origin:center;animation:spin .35s linear infinite}
.gch-grid .gmore{display:grid;place-items:center;align-content:center;gap:8px;min-height:120px}.gch-grid .gmore b{font-size:44px;font-weight:400}
/* 정비소 */
.gchoose{width:min(100%,820px);align-self:start}.gch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.gch-grid .pick svg{width:100%;aspect-ratio:1;pointer-events:none}
.stagebox svg.gstage{aspect-ratio:16/9;width:100%;height:auto;max-height:100%}
.stagebox svg.gstage svg{max-width:none;aspect-ratio:auto;border-radius:0}
.gstage .gcarw{transition:transform 1.8s cubic-bezier(.3,.6,.3,1)}
.gstage .glift{transition:transform 1s ease-in-out}.gstage.up .glift{transform:translateY(-46px)}
.gstage .gclock{animation:spin 8s linear infinite;transform-origin:700px 90px}
.pic g.wheel.gflat{transform:scale(1.05,.62);transform-origin:50% 100%;opacity:.6}
.gbonk{animation:shake .3s}
.gbolt>g{transform-box:fill-box;transform-origin:center}.gbolt.loose>g{animation:wag .3s ease-in-out infinite alternate}.gbolt.tight>g{animation:spin .35s linear 2}.gbolt.tight path:first-child{fill:#C9CED9}
.gdent path{transform-box:fill-box;transform-origin:center;transition:transform .2s,opacity .3s}.gdent.gone path{opacity:0;transform:scale(0)}
.glamp .gbeam{opacity:0;transition:opacity .4s}.glamp.on .gbeam{opacity:.75}
.gtodo{position:absolute;right:10px;top:8px;display:flex;gap:6px;z-index:2;pointer-events:none}
.gtodo span{width:42px;height:42px;background:#fff;border-radius:12px;display:grid;place-items:center;opacity:.45;position:relative;font-size:22px;color:#2E9E5B}
.gtodo span i{display:block;width:30px;height:30px;grid-area:1/1}.gtodo span i svg{width:100%;height:100%;display:block}
.gtodo span.now{opacity:1;box-shadow:0 0 0 3px var(--accent)}.gtodo span.ok{opacity:1}
.gtodo span.ok::after{content:'✓';grid-area:1/1;font-size:30px;color:#2E9E5B;text-shadow:0 0 4px #fff,0 0 4px #fff}
.gtools{position:absolute;inset:0}
.gtools .gauge{position:absolute;right:16px;top:auto;bottom:14px;transform:none;width:min(40%,240px)}
.gcols{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 220px)}
.gcols .swatch{width:52px;height:52px;border-radius:50%}
.token.tapme{animation:gpulse 1s ease-in-out infinite}@keyframes gpulse{50%{transform:scale(1.08)}}
.token.pumped svg{animation:pop .3s}
/* 큰 장면 색칠 */
.dots .pbar{display:block;width:clamp(90px,16vw,200px);height:16px;border-radius:9px;background:#fff;border:3px solid var(--ink);overflow:hidden;padding:0;align-self:center}
.dots .pbar i{display:block;height:100%;background:linear-gradient(90deg,#FFD93D,#FF9F43);transition:width .3s}
.dots .pnum2{font-weight:400;font-size:17px;white-space:nowrap}
.tl-glow circle{opacity:0}
.alive .tl-glow circle{animation:tlc 3s linear infinite}.alive .tl-glow circle:nth-child(2){animation-delay:-2s}.alive .tl-glow circle:nth-child(1){animation-delay:-1s}
@keyframes tlc{0%,32%{opacity:.85}34%,100%{opacity:0}}
.alive .pm-noz{animation:pmn 1.2s ease-in-out infinite alternate}@keyframes pmn{to{transform:translate(4px,-8px)}}
.alive .pm-scr{animation:flash .6s steps(2) infinite}
.alive .cr-car{animation:crc 2s ease-in-out infinite alternate}.alive .cr-bus{animation:crc 2.6s ease-in-out infinite alternate-reverse}@keyframes crc{to{transform:translateX(14px)}}
.alive .cr-duck{animation:crd 3s ease-in-out infinite alternate}@keyframes crd{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.alive .cr-cl{animation:drift 3s ease-in-out infinite alternate}
.alive .gs-car{animation:gsl 1.6s ease-in-out infinite alternate}@keyframes gsl{to{transform:translateY(-44px)}}
.alive .gs-hand{animation:spin 4s linear infinite;transform-origin:336px 50px}
.alive .gs-lamp{animation:sway 1.6s ease-in-out infinite;transform-origin:232px 54px}
.alive .ws-bl{animation:wsb .25s ease-in-out infinite alternate;transform-origin:112px 223px}.alive .ws-br{animation:wsb .25s ease-in-out infinite alternate-reverse;transform-origin:288px 223px}@keyframes wsb{to{transform:scaleX(.72)}}
.alive .ws-bt{animation:wsbt .25s ease-in-out infinite alternate;transform-origin:200px 147px}@keyframes wsbt{to{transform:scaleY(.7)}}
.alive .ws-bub circle{animation:bub 1.8s ease-in infinite}.alive .ws-bub circle:nth-child(2){animation-delay:.45s}.alive .ws-bub circle:nth-child(3){animation-delay:.9s}.alive .ws-bub circle:nth-child(4){animation-delay:1.35s}
.alive .ws-drop{animation:wsd .9s linear infinite}@keyframes wsd{from{transform:translateY(-6px);opacity:1}to{transform:translateY(40px);opacity:0}}
.alive .ws-lamp{animation:flash .7s steps(2) infinite}.alive .ws-lamp+.ws-lamp{animation-delay:.23s}
.alive .ws-car{animation:chug .5s ease-in-out infinite alternate}
.alive .st-jib{animation:stj 3s ease-in-out infinite alternate;transform-origin:183px 60px}@keyframes stj{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.alive .st-hook{animation:sth 1.5s ease-in-out infinite alternate}@keyframes sth{to{transform:translateY(28px)}}
.alive .st-arm{animation:sta 1s ease-in-out infinite alternate;transform-origin:107px 267px}@keyframes sta{to{transform:rotate(-12deg)}}
.pic g.st-arm.jiggle{animation:sta .35s ease-in-out 2 alternate;transform-origin:107px 267px}
.pic g.st-jib.jiggle{animation:stj .4s ease-in-out 2 alternate;transform-origin:183px 60px}
.pic g.gs-car.jiggle{animation:gsl .4s ease-in-out 2 alternate}
.pic g.ws-bl.jiggle{animation:wsb .2s ease-in-out 4 alternate;transform-origin:112px 223px}.pic g.ws-br.jiggle{animation:wsb .2s ease-in-out 4 alternate;transform-origin:288px 223px}
.pic g.pm-noz.jiggle{animation:pmn .3s ease-in-out 2 alternate}
.pic g.cr-duck.jiggle{animation:crd .4s ease-in-out 2 alternate}
/* 움직이는 그림책 무대 */
.tstage-wrap{min-height:0;display:grid;place-items:center}
.tstage{width:100%;height:100%;display:block;touch-action:manipulation;--sky:#BFE6FA}
.tstage[data-t=sunset]{--sky:#FFC79E}.tstage[data-t=night]{--sky:#2E3A6E}.tstage[data-t=cloudy]{--sky:#B9C6D3}.tstage[data-t=warm]{--sky:#FFE3A0}
.tstage .sky{fill:var(--sky);transition:fill 1.4s}.tstage .moonbite{fill:var(--sky);transition:fill 1.4s}
.tstage .o,.tcover .o{stroke:#3A3A48;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.tstage .L{opacity:0;transition:opacity 1.2s}
.tstage[data-bg=land] :is(.L-hill,.L-ground),.tstage[data-bg=road] :is(.L-hill,.L-ground,.L-road),.tstage[data-bg=site] :is(.L-hill,.L-ground,.L-road),.tstage[data-bg=rail] :is(.L-hill,.L-ground,.L-rail),.tstage[data-bg=sea] .L-sea,.tstage[data-bg=under] .L-under{opacity:1}
.tstage:not(.nosun):not([data-t=night]) .L-sun,.tstage[data-t=night] .L-stars{opacity:1}
.tstage .L-sun{transition:opacity 1.2s,transform 1.6s}.tstage[data-t=sunset] .L-sun{transform:translateY(150px)}.tstage[data-t=sunset] .L-sun circle{fill:#FF8A50}
.tstage .ground{fill:#B8E986;transition:fill 1.2s}.tstage[data-bg=site] .ground{fill:#E3C58F}.tstage[data-t=night] .ground{fill:#5E8A5A}.tstage[data-t=sunset] .ground{fill:#C9DB86}
.tstage .hill{fill:#9AD68A}.tstage .hill2{fill:#8ACB7A}
.tstage .cloud{fill:#fff;animation:stDrift 18s ease-in-out infinite alternate}.tstage .c2{animation-duration:24s}.tstage .c3{animation-duration:30s}
.tstage[data-t=night] .clouds{opacity:.25}.tstage .clouds{transition:opacity 1.2s}
@keyframes stDrift{to{transform:translateX(140px)}}
.tstage .wave{animation:stWave 3s linear infinite}@keyframes stWave{to{transform:translateX(100px)}}
.tstage .prop{opacity:0;transition:opacity .9s;pointer-events:none}.tstage .prop.on{opacity:1}
.tstage .grow{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.15);transition:transform 1.1s cubic-bezier(.3,1.5,.5,1)}.tstage .prop.on .grow{transform:scale(1)}
.tstage .crown{transform-box:fill-box;transform-origin:50% 100%}.tstage[data-fx=windy] .crown{animation:stSway .45s ease-in-out infinite alternate}
@keyframes stSway{from{transform:rotate(-5deg)}to{transform:rotate(7deg) skewX(-6deg)}}
.tstage .leaves{opacity:0}.tstage[data-fx=windy] .leaves{opacity:1;animation:stLeaf 1.6s linear infinite}
@keyframes stLeaf{from{transform:translate(120px,-20px)}to{transform:translate(-260px,60px) rotate(200deg)}}
.tstage .flagw{transform-box:fill-box;transform-origin:0 50%;animation:stFlag .6s ease-in-out infinite alternate}@keyframes stFlag{to{transform:scaleX(.8) skewY(6deg)}}
.tstage .hearts path{transform-box:fill-box;transform-origin:center;animation:stHeart 2.4s ease-out infinite}
@keyframes stHeart{0%{transform:translateY(40px) scale(.3);opacity:0}30%{opacity:1}100%{transform:translateY(-90px) scale(1);opacity:0}}
.tstage .kid{transform-box:fill-box;animation:stKid .5s ease-in-out infinite alternate}@keyframes stKid{to{transform:translateY(-10px)}}
.tstage .flames path{transform-box:fill-box;transform-origin:50% 100%;animation:stFlick .28s ease-in-out infinite alternate}@keyframes stFlick{to{transform:scaleY(.8) scaleX(1.1)}}
.tstage .water path{animation:stDash .4s linear infinite}@keyframes stDash{to{stroke-dashoffset:-42}}
.tstage .prop.on .duck{animation:stDuck 7s linear infinite}@keyframes stDuck{from{transform:translate(860px,372px) scaleX(-1)}to{transform:translate(-80px,372px) scaleX(-1)}}
.tstage .duck{transform:translate(860px,372px)}
.tstage .smoke circle,.tstage .flames2 ellipse{transform-box:fill-box;transform-origin:center;animation:stPuff 1.8s ease-out infinite}
@keyframes stPuff{0%{transform:translate(0,0) scale(.4);opacity:.95}100%{transform:translate(-90px,-150px) scale(1.9);opacity:0}}
.tstage .flames2 ellipse{animation-name:stPuff2}@keyframes stPuff2{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6) translateY(-20px);opacity:.2}}
.tstage .bubbles circle{animation:stBub 3s ease-in infinite}@keyframes stBub{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-300px);opacity:0}}
.tstage .fishes g{animation:stSwim 9s linear infinite}@keyframes stSwim{from{transform:translateX(-60px)}to{transform:translateX(860px)}}
.tstage .gulls{animation:stGull 2s ease-in-out infinite alternate}@keyframes stGull{to{transform:translate(30px,-14px)}}
.tstage .drift{animation:stDrift 12s ease-in-out infinite alternate}
.tstage .spout path{transform-box:fill-box;transform-origin:50% 100%;animation:stFlick .35s ease-in-out infinite alternate}
.tstage .actor{transition:transform 1.7s cubic-bezier(.45,.05,.3,1),opacity .9s;cursor:pointer}
.tstage .actor .fl{transition:transform .8s ease}.tstage .actor .marks{transition:transform .8s}
.tstage.instant .actor,.tstage.instant .actor .fl,.tstage.instant .actor .marks{transition:none!important}
.tstage :is(.in,.tp){transform-box:fill-box;transform-origin:50% 100%}.tstage .ctr :is(.in,.tp){transform-origin:50% 50%}
.tstage .zz,.tstage .ex{opacity:0;transition:opacity .4s}.tstage .a-sleep .zz{opacity:1;animation:stZz 2s ease-in-out infinite}.tstage .a-shake .ex{opacity:1}
@keyframes stZz{50%{transform:translate(8px,-12px)}}
.tstage .a-walk .in{animation:stWalk .42s ease-in-out infinite alternate}@keyframes stWalk{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-10px) rotate(3deg)}}
.tstage .a-hop .in{animation:stHop .55s ease-in-out infinite}@keyframes stHop{0%,100%{transform:translateY(0) scaleY(.92)}50%{transform:translateY(-48px) scaleY(1.04)}}
.tstage .a-sleep .in{animation:stSleep 2.6s ease-in-out infinite}@keyframes stSleep{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.92) scaleX(1.03)}}
.tstage .a-shake .in{animation:stShake .22s linear infinite}@keyframes stShake{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.tstage .a-wobble .in{animation:stShake .5s linear infinite}
.tstage .a-cheer .in{animation:stCheer .75s ease-in-out infinite}@keyframes stCheer{0%,100%{transform:translateY(0)}30%{transform:translateY(-36px) rotate(-6deg)}60%{transform:translateY(-36px) rotate(6deg)}}
.tstage .a-laugh .in{animation:stLaugh .3s ease-in-out infinite alternate}@keyframes stLaugh{to{transform:scaleY(1.05) rotate(-3deg)}}
.tstage .a-float .in{animation:stFloat 2.4s ease-in-out infinite alternate}@keyframes stFloat{to{transform:translateY(-16px)}}
.tstage .a-blow .in{animation:stBlow .7s ease-in-out infinite alternate}@keyframes stBlow{to{transform:scaleX(1.12) scaleY(.96)}}
.tstage .a-glow .in{animation:stGlow .9s ease-in-out infinite alternate}@keyframes stGlow{to{transform:scale(1.1)}}
.tstage .a-drive .in{animation:stDrive .3s ease-in-out infinite alternate}@keyframes stDrive{to{transform:translateY(-4px)}}
.tstage .rays{animation:spin 14s linear infinite}.tstage .a-glow .rays{animation-duration:3s}
.tstage .gust{opacity:0;transition:opacity .3s}.tstage .a-blow .gust{opacity:1}.tstage .a-blow .gust path{animation:stDash .5s linear infinite}
.tstage .cheek{opacity:0}.tstage .a-blow .cheek{opacity:1}.tstage .a-blow .mouth{transform-box:fill-box;transform-origin:center;transform:scale(.6,1.2)}
.tstage .sweat{opacity:0;transition:opacity .5s}.tstage .hot .sweat{opacity:1}
.tstage .coat,.tstage .coatdrop{transition:opacity .8s}.tstage .coatdrop{opacity:0}.tstage .nocoat .coat{opacity:0}.tstage .nocoat .coatdrop{opacity:1}
.tstage .tp.bump{animation:stBump .5s ease-out}@keyframes stBump{30%{transform:scale(1.14,.88)}60%{transform:scale(.94,1.08)}}
.tstage .ring{fill:rgba(255,217,61,.12);stroke:#FFB627;stroke-width:8;stroke-dasharray:18 14;opacity:0;transition:opacity .3s}
.tstage .hint .ring{opacity:1;animation:stRing .8s ease-in-out infinite alternate}@keyframes stRing{to{stroke-width:15;stroke-dashoffset:-32}}
.pnav.nudge{animation:stNudge 1s ease-in-out infinite}@keyframes stNudge{50%{transform:scale(1.15);background:var(--accent);color:#fff}}
.bcover .tcover{width:100%;aspect-ratio:1;border-radius:16px;pointer-events:none}
@media (prefers-reduced-motion:reduce){.tstage *{animation-duration:0s!important}}
.topbar>.dots,.topbar>.brush{margin-left:auto}
.qr-btn{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:5px 10px 5px 5px;box-shadow:0 4px 0 var(--tool-shadow);font-size:16px}
.qr-mini{width:40px;height:40px;display:block}
.qr-mini svg,.qr-big svg{width:100%;height:100%;display:block}
.share-card{width:min(640px,100%)}
.share-body{display:flex;gap:22px;align-items:center}
.qr-big{flex:none;width:min(260px,62vw);aspect-ratio:1;background:#fff;padding:12px;border-radius:20px;box-shadow:0 0 0 4px var(--bg)}
.steps{margin:0;padding-left:22px;display:grid;gap:10px;font-size:19px;line-height:1.4}
.steps b{font-weight:400;color:var(--accent)}
.url{margin:16px 0 0;font-family:ui-monospace,monospace;font-size:14px;word-break:break-all;color:var(--muted);user-select:text;-webkit-user-select:text}
.share-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{background:var(--bg);border-radius:999px;padding:12px 22px;font-size:18px}
.pill.dark{background:var(--ink);color:#fff}
@media (max-width:600px){.share-body{flex-direction:column;align-items:flex-start}.qr-btn span:last-child{display:none}.qr-btn{padding:4px}.qr-mini{width:34px;height:34px}}
</style>

</head>
<body>
<div class="app">
  <div class="palette" id="palette" role="group" aria-label="색 고르기"></div>

  <main class="stage">
    <div class="topbar">
      <div><h1 id="picName" style="display:inline">물고기</h1><span class="hint">색을 고르고 그림을 콕!</span><span class="mission" id="mission" hidden><i id="mColor"></i><span>반짝이는 곳!</span><span class="stars" id="stars">★ 0</span></span></div>
      <div class="seg" id="seg" role="group" aria-label="칠하는 방법">
        <button type="button" data-m="fill" aria-label="콕 채우기"><svg viewBox="0 0 24 24"><path d="M5 11l7-7 7 7-7 7z"/><path d="M19 15c0 1.7 1 2.6 1 3.5a1.5 1.5 0 0 1-3 0c0-.9 1-1.8 2-3.5z"/></svg><span>콕</span></button>
        <button type="button" data-m="brush" aria-label="쓱쓱 붓"><svg viewBox="0 0 24 24"><path d="M18 3l3 3-9 9-3-3z"/><path d="M9 12c-3 0-5 2-5 5 0 1-1 2-2 2 2 2 7 2 9-1 1-1.5 1-3.5-2-6z"/></svg><span>쓱쓱</span></button>
        <button type="button" data-m="sticker" aria-label="스티커"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>스티커</span></button>
      </div>
      <div class="stk-tray" id="stkTray" hidden role="group" aria-label="스티커 고르기"></div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="brush" id="brush" hidden role="group" aria-label="붓 굵기">
        <button class="bsz" type="button" data-s="0" aria-label="가는 붓"><i style="--d:10px"></i></button>
        <button class="bsz" type="button" data-s="1" aria-label="중간 붓"><i style="--d:20px"></i></button>
        <button class="bsz" type="button" data-s="2" aria-label="굵은 붓"><i style="--d:32px"></i></button>
        <button class="bsz rainbow" type="button" id="rainbow" aria-label="무지개 붓"><i></i></button>
        <button class="bsz" type="button" id="guideBtn" aria-label="따라 그리기" hidden><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg></button>
      </div>
      <button class="qr-btn" id="qrBtn" type="button" aria-label="다른 기기로 옮기기 QR"><span class="qr-mini" id="qrMini"></span><span>QR</span></button>
    </div>
    <div class="board" id="board">
      <svg id="guide" viewBox="0 0 400 400" hidden></svg>
      <canvas id="paper" hidden></canvas>
      <div class="toast" id="toast" hidden></div>
      <div id="game" hidden></div>
      <div class="done" id="done" hidden><span id="doneText">다 칠했어요!</span> <button id="again" class="again" type="button">새로 칠하기</button><button id="next" type="button">다음 그림 ▶</button></div>
    </div>
  </main>

  <nav class="tools" aria-label="도구">
    <button class="tool" id="tPick" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span>그림</span></button>
    <button class="tool" id="tUndo" type="button"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>되돌리기</span></button>
    <button class="tool" id="tErase" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4.5 14.5 13 6a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L11.5 19.5H8z"/><path d="M9 10l5 5"/><path d="M12 20h8"/></svg><span>지우개</span></button>
    <button class="tool" id="tSound" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" id="soundIcon"></svg><span>소리</span></button>
    <button class="tool" id="tReset" type="button" title="꾹 누르면 처음부터"><div class="hold"></div><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v5h5"/></svg><span>처음부터</span></button>
  </nav>

/* 오늘은 그만: 어른 설정의 시간이 되면 부드럽게 끝내요 */
const LIMITS=[0,20,30,40];
function useTick(){
  const t=new Date().toDateString();if(!S.use||S.use.day!==t)S.use={day:t,sec:0,warned:0};
  if(document.hidden||!S.limit)return;S.use.sec+=10;save();
  const lim=S.limit*60;
  if(S.use.sec>=lim-120&&!S.use.warned&&S.use.sec<lim){S.use.warned=1;save();try{toast('2분 뒤에 끝나요!')}catch(e){}speak('2분 뒤에 오늘 놀이가 끝나요!')}
  if(S.use.sec>=lim&&!document.getElementById('rest'))showRest();
}
function showRest(){
  clearTimers();try{musicOff()}catch(e){}const v=document.querySelector('video');if(v)v.pause();
  const ov=document.createElement('div');ov.id='rest';
  ov.innerHTML=`<div class="rest-card"><div class="rest-pic"></div><h2>오늘은 여기까지!</h2><p>자동차들도 이제 코~ 자요.<br>내일 또 만나요!</p>
    <button class="rest-hold" type="button"><i></i><span>어른: 3초 꾹 눌러 10분 더</span></button></div>`;
  document.body.appendChild(ov);const sv=thumb(PICS.find(p=>p.id==='car'));ov.querySelector('.rest-pic').appendChild(sv);
  ov.querySelector('.rest-pic').insertAdjacentHTML('beforeend','<span class="rest-z">Z z z</span>');
  speak('오늘은 여기까지! 내일 또 만나요!');
  const hb=ov.querySelector('.rest-hold');let tm=null;
  const start=e=>{e.preventDefault();hb.classList.add('holding');tm=setTimeout(()=>{S.use.sec=Math.max(0,S.limit*60-600);S.use.warned=0;save();ov.remove();tone(784,.15)},3000)};
  const stop=()=>{hb.classList.remove('holding');clearTimeout(tm)};
  hb.addEventListener('pointerdown',start);['pointerup','pointercancel','pointerleave'].forEach(k=>hb.addEventListener(k,stop));hb.addEventListener('contextmenu',e=>e.preventDefault());
}
function limitUI(){
  const box=document.getElementById('limitBox');if(!box)return;
  const used=S.use&&S.use.day===new Date().toDateString()?Math.floor(S.use.sec/60):0;
  box.innerHTML=`<h3 class="lim-h">오늘은 그만 알림 <small>오늘 쓴 시간 ${used}분</small></h3><div class="lim-row">${LIMITS.map(m=>`<button type="button" class="lim" data-m="${m}" aria-pressed="${(S.limit||0)===m}">${m?m+'분':'끔'}</button>`).join('')}</div>
    <p class="parent-note">정한 시간이 되면 "오늘은 여기까지!" 화면이 떠요. 2분 전에 미리 알려 줘요. 어른이 3초 꾹 누르면 10분 더 할 수 있어요.</p>`;
  box.querySelectorAll('.lim').forEach(b=>b.addEventListener('click',()=>{S.limit=+b.dataset.m;save();limitUI()}));
}

let match={first:null,lock:false,left:0};
function startMatch(){
  done.hidden=true;const n=[3,4,6][S.level]||4,pics=shuffle(PICS.filter(p=>!p.big)).slice(0,n),cards=shuffle([...pics,...pics]);
  match={first:null,lock:false,left:n};
  const g=$('game');g.innerHTML='<div class="mgrid"></div>';const grid=g.querySelector('.mgrid');
  cards.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='mcard';b.dataset.id=p.id;b.setAttribute('aria-label','카드');
    b.innerHTML='<div class="in"><div class="face back"><i>?</i></div><div class="face front"></div></div>';
    b.querySelector('.front').appendChild(thumb(p));onTap(b,()=>flipCard(b,p));grid.appendChild(b)});
  layoutGame();setScore(S.mstars||0);speak('똑같은 그림을 찾아요!');
}
function flipCard(b,p){
  if(match.lock||b.classList.contains('open'))return;
  b.classList.add('open');tone(520,.08);
  if(!match.first){match.first=b;return}
  const a=match.first;match.first=null;
  if(a.dataset.id===b.dataset.id){
    [a,b].forEach(x=>{x.classList.add('matched');x.querySelector('svg').classList.add('alive')});
    match.left--;tone(784,.15,.1,.2);speak(p.name+'!');if(VSFX[p.id])later(VSFX[p.id],600);
    if(!match.left){S.mstars=(S.mstars||0)+1;save();setScore(S.mstars);
      later(()=>{confetti();speak('우와! 다 찾았어요!');$('doneText').textContent='다 찾았어요!';$('next').textContent='한 번 더 ▶';$('again').hidden=true;done.hidden=false},1000)}
  }else{match.lock=true;later(()=>{a.classList.remove('open');b.classList.remove('open');match.lock=false},1000)}
}
function layoutGame(){
  if(S.mode==='puzzle'){if(pz)layoutPuzzle(false);return}
  if(S.mode!=='match')return;const grid=$('game').querySelector('.mgrid');if(!grid)return;
  const total=grid.children.length,bw=board.clientWidth-32,bh=board.clientHeight-32;
  let c=total===6?3:4;if(bh>bw)c=total===12?3:2;const r=Math.ceil(total/c);
  const cs=Math.max(60,Math.floor(Math.min((bw-(c-1)*12)/c,(bh-(r-1)*12)/r)));
  grid.style.gridTemplateColumns=`repeat(${c},${cs}px)`;grid.style.gridAutoRows=cs+'px';
}

/* 퍼즐 조각 모양: 이웃끼리 볼록·오목이 맞물려요 */
function pzEdge(A,B,s,T){
  if(!s)return `L${B[0].toFixed(1)} ${B[1].toFixed(1)}`;
  const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),u=[dx/L,dy/L],n=[u[1],-u[0]];
  const P=(a,b)=>{const x=A[0]+u[0]*a*L+n[0]*b*T*s,y=A[1]+u[1]*a*L+n[1]*b*T*s;return x.toFixed(1)+' '+y.toFixed(1)};
  return `L${P(.36,0)} C${P(.42,0)} ${P(.28,1)} ${P(.5,1)} C${P(.72,1)} ${P(.58,0)} ${P(.64,0)} L${P(1,0)}`;
}
function pzPath(c,r){
  const{C,R,H,V}=pz,w=400/C,h=400/R,x=c*w,y=r*h,T=.24*Math.min(w,h);
  const top=r>0?-H[r][c]:0,bot=r<R-1?H[r+1][c]:0,lef=c>0?-V[r][c]:0,rig=c<C-1?V[r][c+1]:0;
  // 시계 방향으로 돌면 바깥쪽이 왼손 방향이 되도록 n=(u.y,-u.x)
  return `M${x} ${y} `+pzEdge([x,y],[x+w,y],top,T)+' '+pzEdge([x+w,y],[x+w,y+h],rig,T)+' '+pzEdge([x+w,y+h],[x,y+h],bot,T)+' '+pzEdge([x,y+h],[x,y],lef,T)+' Z';

function playPuzzle(p,art){

  const lines=svgEl('svg',{viewBox:'0 0 400 400',class:'pz-lines',preserveAspectRatio:'none'});

  frame.appendChild(lines);

function pzGeom(){
  const W=pz.box.clientWidth,H=pz.box.clientHeight,port=H>W;

  const cw=F/pz.C,ch=F/pz.R,m=pz.M/(400/pz.C)*cw,mh=pz.M/(400/pz.R)*ch;

function layoutPuzzle(init){
  if(!pz||!pz.box.isConnected)return;const G=pzGeom();
  Object.assign(pz.frame.style,{left:G.fx+'px',top:G.fy+'px',width:G.F+'px',height:G.F+'px'});
  const loose=shuffle(pz.pieces.filter(q=>!q.placed));
  if(init){const n=loose.length;let k=1,cols=1,rows=n;
    for(k=1;k>.45;k-=.05){cols=Math.max(1,Math.floor(G.tray.w/(G.cw*k*1.04)));rows=Math.ceil(n/cols);if(rows*G.ch*k*1.04<=G.tray.h)break}
    pz.k=Math.max(.45,k);pz.box.style.setProperty('--k',pz.k.toFixed(2));
    const cwk=G.pw*pz.k,chk=G.ph*pz.k,sx=cols>1?(G.tray.w-cwk)/(cols-1):0,sy=rows>1?(G.tray.h-chk)/(rows-1):0;
    loose.forEach((q,i)=>{const cx=G.tray.x+cwk/2+(i%cols)*Math.min(sx,cwk*1.15)+(Math.random()-.5)*6,cy=G.tray.y+chk/2+Math.floor(i/cols)*Math.min(sy,chk*1.1)+(Math.random()-.5)*6;
      q.fx=(cx-G.pw/2)/G.W;q.fy=(cy-G.ph/2)/G.H})}
  pz.pieces.forEach(q=>{Object.assign(q.el.style,{width:G.pw+'px',height:G.ph+'px'});
    if(q.placed){q.el.style.left=(G.fx+q.c*G.cw-G.m)+'px';q.el.style.top=(G.fy+q.r*G.ch-G.mh)+'px'}

function dragPiece(q){

      tone(660+(pz.C*pz.R-pz.left)*30,.12,0,.18);const r=q.el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,'#FFC93C',10);

  const stopX=322,order=s.cars.slice().sort((a,b)=>b.x-a.x);

    const front=c.x+c.half;if((s.light!=='green'||s.peds.some(p=>p.state==='cross'))&&front<=stopX+4)limit=stopX-c.half;
    if(ahead)limit=Math.min(limit,ahead.x-ahead.half-c.half-16);
    const vmax=c.amb?0.22:0.16;c.v=Math.min(vmax,c.v+dt*.0004);let nx=c.x+c.v*dt;if(nx>limit){nx=Math.max(c.x,limit);c.v=0}
    if(c.v===0){c.waited+=dt;if(c.amb&&c.waited>2500&&c.waited-dt<=2500)speak('구급차가 기다려요! 초록불로!')}
    c.x=nx;c.g.setAttribute('transform',`translate(${c.x.toFixed(1)} 372)`);c.sv.classList.toggle('alive',c.v>0);
    if(c.x>900){c.g.remove();c.gone=true;s.carsDone++;tone(523,.08,0,.1);if(c.amb){s.bonus=1;speak('구급차가 무사히 지나갔어요! 고마워요!');burst(innerWidth*.7,innerHeight*.4,'#F2545B',20)}sigScore()}});
  s.cars=s.cars.filter(c=>!c.gone);
  // 친구들: 도착 → 기다림 → (빨간불이면) 건너기 → 사라짐
  const crossOK=s.light==='red'&&!s.cars.some(c=>c.x+c.half>340&&c.x-c.half<470);
  s.peds.forEach(p=>{const sp=(p.hurry?.12:.07)*dt;
    if(p.state==='come'){const tx=395-p.slot*48;p.x=Math.min(tx,p.x+sp);if(p.x>=tx)p.state='wait'}
    else if(p.state==='wait'){if(crossOK&&p.slot===0){p.state='cross'}else if(crossOK){p.slot=Math.max(0,p.slot-1)}else{const tx=395-p.slot*48;if(p.x<tx)p.x=Math.min(tx,p.x+sp)}}
    else if(p.state==='cross'){if(p.x<410)p.x=Math.min(410,p.x+sp);p.y-=sp*.95;if(p.y<=242){p.state='leave';s.pedsDone++;tone(880,.1,0,.12);tone(1175,.12,.1,.12);sigScore();s.peds.filter(q=>q.state==='wait'||q.state==='come').forEach(q=>q.slot=Math.max(0,q.slot-1))}}
    else if(p.state==='leave'){p.x+=sp*1.2;if(p.x>860){p.state='gone';p.g.remove()}}
    const k=p.y<400?(.72+.28*(p.y-242)/(416-242)):1;p.g.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) scale(${(p.sc*k).toFixed(3)})`);
    p.g.classList.toggle('walk',p.state!=='wait')});
  s.peds=s.peds.filter(p=>p.state!=='gone');
  // 도움말: 친구가 오래 기다리거나 차가 줄을 서면 알려 줘요
  const waiting=s.peds.some(p=>p.state==='wait'),queue=s.cars.filter(c=>c.v===0).length;
  s.waitT=waiting&&s.light==='green'?s.waitT+dt:0;s.queueT=queue>=3&&s.light==='red'&&!s.peds.some(p=>p.state==='cross')?s.queueT+dt:0;
  if(s.t-s.nag>7000){if(s.waitT>4000){speak('친구들이 기다려요! 신호등을 눌러 빨간불로 바꿔요!');s.nag=s.t;s.st.classList.add('hintl')}else if(s.queueT>4000){speak('자동차가 줄을 섰어요! 초록불로 바꿔 줄까?');s.nag=s.t;s.st.classList.add('hintl')}}
  if(!s.waitT&&!s.queueT)s.st.classList.remove('hintl');
  if(!s.fin&&s.carsDone>=s.needC&&s.pedsDone>=s.needP){s.fin=true;speak('신호등 대장! 모두 안전하게 지나갔어요!');gameDone('신호등 대장!','sigstars',PICS.find(p=>p.id==='tlight'))}
  s.raf=requestAnimationFrame(sigLoop);
}

/* 운전하기: 차 고르기 → 지도마다 다른 길 → 동전 모으기, 횡단보도에선 친구가 건널 때까지 기다리기, 빨간불엔 멈추기, 빵빵, 차고 도착 */
let drv=null;
const TREE=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#5BC27A" stroke="#2B2D42" stroke-width="5"/><rect x="${x-5}" y="${y+r-4}" width="10" height="${r*.8}" fill="#A8714A" stroke="#2B2D42" stroke-width="4"/>`;
const HOUSE=(x,y,c)=>`<path d="M${x-30} ${y} L${x} ${y-26} L${x+30} ${y} L${x+30} ${y+34} L${x-30} ${y+34} Z" fill="${c}" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round"/><rect x="${x-8}" y="${y+12}" width="16" height="22" fill="#fff" stroke="#2B2D42" stroke-width="3"/>`;
const DMAPS=[
 {name:'마을길',bg:'#B8E986',d:'M50 360 C190 370 210 240 330 240 S470 330 540 230 S650 110 712 120',
  deco:TREE(130,90,30)+TREE(470,80,26)+TREE(300,400,24)+TREE(640,390,28)+HOUSE(270,60,'#FF8FC1')+HOUSE(90,220,'#FFD93D')+HOUSE(560,400,'#6EC6F0')},
 {name:'바닷길',horn:[752,46],bg:'#F4D9A0',d:'M50 110 C200 100 230 230 350 250 S520 400 640 340 S700 200 730 330',
  deco:`<path d="M0 0 L800 0 L800 60 Q700 80 600 60 T400 60 T200 60 T0 60 Z" fill="#6EC6F0"/><path d="M0 450 L800 450 L800 420 Q700 400 600 420 T400 420 T200 420 T0 420 Z" fill="#6EC6F0"/>`+
   `<g class="dboat"><path d="M120 404 L180 404 L170 420 L130 420 Z" fill="#F2545B" stroke="#2B2D42" stroke-width="4"/><path d="M150 404 L150 370 L172 398 Z" fill="#fff" stroke="#2B2D42" stroke-width="3"/></g>`+
   `<circle cx="560" cy="150" r="22" fill="#FF9F43" stroke="#2B2D42" stroke-width="4"/><path d="M560 128 L560 108 M538 150 L470 150" stroke="#2B2D42" stroke-width="4"/>`+TREE(110,240,22)+TREE(480,160,20)+`<path d="M220 360 l10 -18 l10 18 Z M250 380 l8 -14 l8 14 Z" fill="#FF8FC1" stroke="#2B2D42" stroke-width="3"/>`},
 {name:'숲길',bg:'#9AD68A',d:'M60 400 C140 260 260 420 360 300 S470 90 600 150 S720 330 740 230',
  deco:TREE(60,100,34)+TREE(140,160,26)+TREE(250,90,30)+TREE(420,420,26)+TREE(520,330,24)+TREE(700,420,24)+TREE(380,140,22)+TREE(700,60,26)+`<ellipse cx="240" cy="230" rx="40" ry="18" fill="#6EC6F0" stroke="#2B2D42" stroke-width="4"/>`}];
function startDrive(){
  done.hidden=true;clearTimers();drv=null;const g=$('game');
  carChooser('어떤 차로 운전할까?',WHEELED(),driveGo,'rstars');
}
function driveGo(p){
  const g=$('game'),M=DMAPS[(S.dmap=(S.dmap||0)+1)%DMAPS.length],L=S.level;save();
  g.innerHTML=`<div class="stagebox"><svg class="pic drive" viewBox="0 0 800 450" data-uid="${++uid}">
    <rect width="800" height="450" rx="22" fill="${M.bg}"/><g class="deco">${M.deco}</g>
    <path id="road" d="${M.d}" fill="none" stroke="#6B7280" stroke-width="78" stroke-linecap="round"/>
    <path d="${M.d}" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="18 16"/>
    <g class="dzebra"></g><g class="dcoins"></g><g class="garage-house"></g><g class="tlight"></g><g class="dpeds"></g><g class="carwrap"></g>
    <g class="dhorn" transform="translate(${(M.horn||[752,404]).join(' ')})"><circle r="32" fill="#FFD93D" stroke="#2B2D42" stroke-width="5"/><path d="M-13 -8 L0 -8 L13 -19 L13 19 L0 8 L-13 8 Z" fill="#2B2D42"/></g></svg></div>`;
  const ds=g.querySelector('svg.drive'),road=ds.querySelector('#road'),RL=road.getTotalLength(),N=240;
  const pts=[...Array(N).keys()].map(i=>{const q=road.getPointAtLength(RL*i/(N-1));return{x:q.x,y:q.y}});
  const ang=i=>{const a=pts[Math.max(0,i-2)],b=pts[Math.min(N-1,i+2)];return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI};
  const nrm=i=>{const a=pts[Math.max(0,i-2)],b=pts[Math.min(N-1,i+2)],nx=-(b.y-a.y),ny=b.x-a.x,l=Math.hypot(nx,ny)||1;return[nx/l,ny/l]};
  // 차고
  const E=pts[N-1],ea=ang(N-1);ds.querySelector('.garage-house').innerHTML=`<g transform="translate(${E.x} ${E.y}) rotate(${ea})"><g transform="rotate(${-ea})"><path d="M-50 -10 L0 -46 L50 -10 L50 50 L-50 50 Z" fill="#FFD93D" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round"/><rect class="gdoor" x="-32" y="8" width="64" height="42" fill="#fff" stroke="#2B2D42" stroke-width="5"/></g></g>`;
  // 횡단보도와 건너는 친구들
  const cw=Math.round(N*.3),cp=pts[cw];ds.querySelector('.dzebra').innerHTML=`<g transform="translate(${cp.x} ${cp.y}) rotate(${ang(cw)})">${[-3,-2,-1,0,1,2,3].map(k=>`<rect x="-20" y="${k*11-4}" width="40" height="7" fill="#fff"/>`).join('')}</g>`;
  // 신호등
  const stop=Math.round(N*.62),[nx,ny]=nrm(stop),sp=pts[stop],lx=sp.x+nx*70,ly=sp.y+ny*70;
  ds.querySelector('.tlight').innerHTML=`<rect x="${lx-4}" y="${ly}" width="8" height="46" fill="#3A3A48"/><rect x="${lx-18}" y="${ly-62}" width="36" height="66" rx="10" fill="#3A3A48" stroke="#2B2D42" stroke-width="4"/>
    <circle class="lr" cx="${lx}" cy="${ly-44}" r="10" fill="#F2545B"/><circle class="lg" cx="${lx}" cy="${ly-16}" r="10" fill="#4B5563"/>`;
  // 동전
  const coins=[];for(let i=14;i<N-10;i+=[22,18,15][L]){if(Math.abs(i-cw)<6||Math.abs(i-stop)<6)continue;const q=pts[i];const el=svgEl('g',{class:'dcoin',transform:`translate(${q.x} ${q.y})`});el.innerHTML='<g><circle r="13" fill="#FFD93D" stroke="#2B2D42" stroke-width="4"/><path d="M0 -6 L0 6" stroke="#E0A800" stroke-width="4" stroke-linecap="round"/></g>';ds.querySelector('.dcoins').appendChild(el);coins.push({i,el,got:false})}
  const car=thumb(p);car.classList.add('noscene');car.querySelector('.scene')?.remove();car.setAttribute('width',150);car.setAttribute('height',150);car.setAttribute('x',-75);car.setAttribute('y',-112);
  const cwrap=ds.querySelector('.carwrap');cwrap.appendChild(car);
  drv={p,ds,pts,N,cur:0,stop,red:true,waiting:false,down:false,cw:cwrap,lastTone:0,coins,got:0,zebra:cw,pedState:0,ang,nrm,map:M};
  placeCar();driveScore();later(()=>speak(M.name+'! 길을 따라 '+p.name+'를 운전해요! 손가락으로 끌어요! 동전도 모아요!'),300);
  ds.querySelector('.dhorn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();horn();if(drv.pedState===1)drv.hurry=1;const r=e.currentTarget.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,'#FFD93D',8)});
  ds.addEventListener('pointerdown',e=>{if(e.target.closest('.dhorn'))return;e.preventDefault();drv.down=true;try{ds.setPointerCapture(e.pointerId)}catch(_){}driveAt(e)});
  ds.addEventListener('pointermove',e=>{if(drv&&drv.down)driveAt(e)});
  ['pointerup','pointercancel'].forEach(t=>ds.addEventListener(t,()=>{if(drv)drv.down=false}));
}
function driveScore(){$('dots').hidden=false;$('dots').innerHTML=`<b class="gstar sgscore"><span>🪙 ${drv.got} / ${drv.coins.length}</span></b>`}
function placeCar(){const d=drv,a=d.pts[d.cur],b=d.pts[Math.min(d.N-1,d.cur+3)],ang=Math.max(-28,Math.min(28,Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI)),flip=b.x<a.x-1;
  d.cw.setAttribute('transform',`translate(${a.x} ${a.y}) rotate(${flip?-ang:ang})${flip?' scale(-1 1)':''}`)}
function pedsCross(){
  const d=drv;d.pedState=1;const q=d.pts[d.zebra],a=d.ang(d.zebra),kinds=shuffle(['rabbit','turtle','pig1','mouse','pig3']).slice(0,S.level===0?1:2);
  const g=d.ds.querySelector('.dpeds');g.innerHTML='';speak('앗, 친구들이 길을 건너요! 멈춰서 기다려요!');tone(440,.2,0,.15);
  const list=kinds.map((k,i)=>{const el=svgEl('g',{});el.innerHTML=`<g class="in">${ART[k].svg}</g>`;g.appendChild(el);return{el,k,off:-i*34}});
  let t=0;const step=()=>{if(drv!==d)return;t+=d.hurry?.05:.022;
    list.forEach(o=>{const s=Math.min(1,Math.max(0,t+o.off/140)),y=70-140*s;o.el.setAttribute('transform',`translate(${q.x} ${q.y}) rotate(${a}) translate(0 ${y}) rotate(${-a}) scale(.3)`)});
    if(t<1+list.length*.25)later(step,40);else{g.innerHTML='';d.pedState=2;d.hurry=0;speak('고마워요! 이제 출발!');tone(784,.2,0,.15)}};step();
}
function driveAt(e){
  const d=drv;if(!d||d.cur>=d.N-1)return;const pt=toLocal(d.ds,e);
  let best=-1,bd=1e9;for(let i=d.cur;i<Math.min(d.N,d.cur+22);i++){const q=d.pts[i],dist=Math.hypot(q.x-pt.x,q.y-pt.y);if(dist<bd){bd=dist;best=i}}
  if(bd>90||best<=d.cur)return;
  if(d.pedState<2&&best>=d.zebra-8){best=Math.min(best,d.zebra-8);if(d.pedState===0)pedsCross()}
  if(d.red&&best>=d.stop-2){best=d.stop-2;if(!d.waiting){d.waiting=true;speak('빨간불이에요! 멈춰요!');tone(440,.2,0,.15);
    later(()=>{d.red=false;d.ds.querySelector('.lr').setAttribute('fill','#4B5563');d.ds.querySelector('.lg').setAttribute('fill','#5BC27A');speak('초록불! 출발!');tone(784,.2,0,.15)},2000)}}
  if(best<=d.cur)return;d.cur=best;placeCar();
  d.coins.forEach(c=>{if(!c.got&&d.cur>=c.i-1){c.got=true;d.got++;c.el.classList.add('got');tone(1318,.08,0,.14);tone(1760,.1,.07,.12);driveScore()}});
  if(d.cur-d.lastTone>5){d.lastTone=d.cur;tone(90+d.cur%3*12,.08,0,.14)}
  if(d.cur>=d.N-2){d.cw.classList.add('parked');d.ds.querySelector('.gdoor')?.classList.add('open');speak('도착! 차고에 쏙! 동전 '+d.got+'개를 모았어요!');if(VSFX[d.p.id])later(VSFX[d.p.id],500);gameDone('도착! 동전 '+d.got+'개','rstars',d.p)}
}

const mmss=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
function showVideos(cat){
  clearTimers();videoPlaying=false;const g=$('game');$('dots').hidden=true;
  if(cat)S.vcat=cat;if(!VCATS.some(c=>c[0]===S.vcat))S.vcat='vehicle';save();

  g.innerHTML=`<div class="vwrap"><div class="vtabs">${VCATS.map(([k,e,n])=>`<button type="button" class="vtab" data-c="${k}" aria-pressed="${k===S.vcat}"><b>${e}</b>${n}</button>`).join('')}</div><div class="vgrid"></div><p class="credit">영상: 위키미디어 공용(광고 없음). 영상마다 만든 사람과 라이선스를 재생 화면 아래에 적었어요.</p></div>`;

}
function playVideo(k){

    <div class="vinfo"><b>${v.name}</b><small>영상: ${v.by} · ${v.lic} · 위키미디어 공용</small></div>
    <div class="page-nav"><button class="pnav" id="pPrev" type="button" aria-label="앞 영상">◀</button><span class="pnum">${i+1} / ${list.length}</span><button class="pnav" id="pNext" type="button" aria-label="다음 영상">▶</button></div></div>`;
  const vid=$('vid');vid.play().catch(()=>{});{const off=g.querySelector('.tale-off');vid.onerror=()=>{vid.hidden=true;off.hidden=false}}
  vid.onended=()=>{tone(660,.15)};
  onTap($('pPrev'),()=>{i>0?playVideo(VIDEOS.indexOf(list[i-1])):showVideos(v.cat)});
  onTap($('pNext'),()=>{i<list.length-1?playVideo(VIDEOS.indexOf(list[i+1])):showVideos(v.cat)});
}

const blive=new Map();
function toLocal(el,e){const m=el.getScreenCTM();if(!m)return{x:0,y:0};const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());return{x:Math.round(pt.x),y:Math.round(pt.y)}}
function brushDown(e){
  const r=e.target.closest('.r');if(!r||!svg.contains(r))return;
  e.preventDefault();try{board.setPointerCapture(e.pointerId)}catch(_){}
  const id=r.dataset.id,L=layerFor(svg,id),pt=toLocal(L.parentNode,e);
  const st={c:curPaint(),w:BRUSH_W[S.level]||18,p:[pt.x,pt.y]};
  blive.set(e.pointerId,{id,st,pa:drawStroke(svg,id,st),L,len:0});tone(480+(S.color%10)*30,.06,0,.1);
}
function brushMove(e){

  for(const ev of (evs.length?evs:[e])){const pt=toLocal(b.L.parentNode,ev),p=b.st.p,dx=pt.x-p[p.length-2],dy=pt.y-p[p.length-1],d=Math.hypot(dx,dy);
    if(d<3)continue;p.push(pt.x,pt.y);b.len+=d;if(b.len>140){b.len=0;tone(300+Math.random()*250,.04,0,.05)}}
  b.pa.setAttribute('d',pathD(b.st.p));
}
function brushUp(e){

  const p=PICS[S.pic],P=paintsOf(p.id);(P[b.id]=P[b.id]||[]).push(b.st);stacks[p.id].push({stroke:b.id});

/* 자유 그리기 — 점은 그림판 중심 기준, 짧은 변 길이로 나눈 값으로 저장 (화면을 돌려도 비율 유지) */
const SIZES=[.012,.026,.048];

let PW=1,PH=1,PS=1;
function sizePaper(){
  if(paper.hidden)return;
  const r=paper.getBoundingClientRect(),d=devicePixelRatio||1;
  PW=r.width;PH=r.height;PS=Math.min(PW,PH);
  paper.width=Math.round(PW*d);paper.height=Math.round(PH*d);pc.setTransform(d,0,0,d,0,0);
  redraw();
}

const toN=e=>{const r=paper.getBoundingClientRect();return[+(((e.clientX-r.left)-PW/2)/PS).toFixed(4),+(((e.clientY-r.top)-PH/2)/PS).toFixed(4)]};
const toP=p=>[PW/2+p[0]*PS,PH/2+p[1]*PS];
function segColor(st,i){return st.rb?`hsl(${(st.h0+i*5)%360} 85% 58%)`:st.c}
function drawSeg(st,i){
  const erase=st.c===null&&!st.rb;

  pc.lineCap='round';pc.lineJoin='round';pc.lineWidth=st.w*PS;
  const b=toP(st.pts[i]);
  if(i===0){pc.fillStyle=erase?'#000':segColor(st,0);pc.beginPath();pc.arc(b[0],b[1],st.w*PS/2,0,7);pc.fill();return}
  const a=toP(st.pts[i-1]);
  pc.strokeStyle=erase?'#000':segColor(st,i);
  pc.beginPath();pc.moveTo(a[0],a[1]);pc.lineTo(b[0],b[1]);pc.stroke();

function redraw(){pc.clearRect(0,0,PW,PH);for(const st of strokes)for(let i=0;i<st.pts.length;i++)drawSeg(st,i);pc.globalCompositeOperation='source-over'}
const live=new Map();
paper.addEventListener('pointerdown',e=>{

  const st={c:S.eraser?null:COLORS[S.color].hex,w,rb:!S.eraser&&S.rainbow,h0:Math.floor(Math.random()*360),pts:[toN(e)]};
  strokes.push(st);live.set(e.pointerId,st);drawSeg(st,0);

    b.insertAdjacentHTML('beforeend',`<span>${p.name}</span>`+(isDone(p)?'<span class="badge">완성</span>':''));

onTap($('again'),()=>{const p=PICS[S.pic];S.fills[p.id]={};S.paints[p.id]={};S.pdone[p.id]=[];S.stickers[p.id]=[];stacks[p.id]=[];save();render();speak('새로 칠해요! 그림첩에 그대로 있어요.');tone(600)});
onTap($('next'),()=>{const RE={count:startCount,hangul:startHangul,signal:startSignal,match:startMatch,puzzle:startPuzzle,spot:startSpot,wash:startWash,garage:startGarage,drive:startDrive}[S.mode];if(RE){done.hidden=true;clearTimers();RE();return}S.pic=(S.pic+1)%PICS.length;save();render();if(S.level!==2)speak(PICS[S.pic].name);tone(520)});

const settings=$('settings');
function openSettings(){
  const box=$('levels');box.innerHTML='';
  LEVELS.forEach((L,i)=>{const b=document.createElement('button');b.type='button';b.className='lv';b.setAttribute('aria-pressed',String(i===S.level));
    b.innerHTML=`<div>${L.label}<small>${L.desc}</small></div>`+(i===S.level?'<b>사용 중</b>':'');
    b.addEventListener('click',()=>{S.level=i;S.eraser=false;if(i===0)S.rainbow=true;buildPalette();save();settings.hidden=true;render();tone(600)});
    box.appendChild(b)});
  settings.hidden=false;try{limitUI()}catch(e){}
}
holdButton($('picName'),2000,()=>{tone(700,.15);openSettings()});
$('sClose').addEventListener('click',()=>{settings.hidden=true});
settings.addEventListener('click',e=>{if(e.target===settings)settings.hidden=true});

buildPalette();buildTray();render();

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
  const URL="https://hanjin-bbang.github.io/kids-play/";
  let svgTag='';
  try{const q=qrcode(0,'M');q.addData(URL);q.make();svgTag=q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){}
  const mini=document.getElementById('qrMini'),big=document.getElementById('qrBig'),share=document.getElementById('share');
  if(svgTag){mini.innerHTML=svgTag;big.innerHTML=svgTag}else{mini.hidden=true;big.hidden=true}
  document.getElementById('qrBtn').addEventListener('click',()=>{share.hidden=false;try{tone(480)}catch(e){}});
  document.getElementById('shClose').addEventListener('click',()=>share.hidden=true);
  share.addEventListener('click',e=>{if(e.target===share)share.hidden=true});
  const copyBtn=document.getElementById('copyBtn');
  copyBtn.addEventListener('click',()=>{
    const done=()=>{copyBtn.textContent='복사했어요';setTimeout(()=>copyBtn.textContent='주소 복사',1500)};
    try{navigator.clipboard.writeText(URL).then(done,()=>{getSelection().selectAllChildren(document.getElementById('shUrl'))})}catch(e){getSelection().selectAllChildren(document.getElementById('shUrl'))}
  });
  let deferred=null;const btn=document.getElementById('installBtn');
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;btn.hidden=false});
  btn.addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;btn.hidden=true});
  addEventListener('appinstalled',()=>{btn.hidden=true});
  if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  /* 새 버전 확인: 앱이 열리거나 다시 화면에 나올 때 */
  const APP_V="15";
  function checkUpdate(){
    fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
      if(!j||j.v===APP_V)return;
      const key='updated-to-'+j.v;try{if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1')}catch(e){}
      try{toast('새 버전으로 바꿔요!')}catch(e){}
      const go=()=>location.replace(location.pathname+'?v='+j.v);
      (navigator.serviceWorker?navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}):Promise.resolve()).then(()=>setTimeout(go,900));
    }).catch(()=>{});
  }
  addEventListener('load',checkUpdate);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
})();
</script>
